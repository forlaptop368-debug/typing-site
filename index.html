<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Type your own text</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5f1;--surface:#fff;--ink:#1d2a24;--mute:#66736c;--line:#d6ddd7;--accent:#1f6f55;--ok:#1f6f55;--badbg:#f6d5d0;--bad:#b3261e;--curbg:#ffe9a8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a17;--surface:#1c2420;--ink:#e6ece8;--mute:#93a09a;--line:#2f3b35;--accent:#5fc9a1;--ok:#7fd8b4;--badbg:#5a2622;--bad:#ff9a90;--curbg:#6b5a1c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141a17;--surface:#1c2420;--ink:#e6ece8;--mute:#93a09a;--line:#2f3b35;--accent:#5fc9a1;--ok:#7fd8b4;--badbg:#5a2622;--bad:#ff9a90;--curbg:#6b5a1c;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Source Serif 4","Noto Sans Devanagari",Georgia,serif}
main{max-width:860px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.6rem;margin:8px 0 4px}
p.sub{color:var(--mute);margin:0 0 20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
label.l{display:block;font-weight:600;margin-bottom:6px}
textarea{width:100%;font:inherit;font-family:Mangal,"Noto Sans Devanagari","Source Serif 4",sans-serif;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;resize:vertical}
textarea:focus,button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px}
button,select,.file{font:inherit;font-size:.95rem;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
:root[data-theme="dark"] button.primary{color:#0b1410}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) button.primary{color:#0b1410}}
.file input{display:none}
.chk{display:flex;gap:6px;align-items:center;color:var(--mute);font-size:.9rem}
.stats{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.stat{flex:1 1 90px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.stat b{display:block;font-size:1.5rem;line-height:1.2;font-variant-numeric:tabular-nums}
.stat span{color:var(--mute);font-size:.85rem}
.bar{height:6px;background:var(--line);border-radius:3px;margin-bottom:12px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .1s}
#show{font-family:Mangal,"Noto Sans Devanagari","Source Serif 4",sans-serif;line-height:2;max-height:260px;overflow-y:auto;white-space:pre-wrap;word-break:break-word;cursor:text;margin-bottom:12px}
#show span{border-radius:3px}
#show .pend{color:var(--mute)}
#show .ok{color:var(--ok)}
#show .bad{background:var(--badbg);color:var(--bad)}
#show .cur{background:var(--curbg);box-shadow:-2px 0 0 var(--accent)}
#inp{min-height:110px}
.done{border-color:var(--accent);margin-bottom:12px}
.krow{display:flex;gap:4px;justify-content:center;margin-top:10px}.krow:nth-child(2){padding-left:14px}.krow:nth-child(3){padding-left:28px}
.k{flex:1 1 0;max-width:54px;text-align:center;border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:2px 0;font-family:Mangal,"Noto Sans Devanagari",sans-serif;line-height:1.3}
.k small{display:block;color:var(--mute);font-size:.8rem}.k b{display:block;font-weight:400}
.k.nk{background:var(--curbg);border-color:var(--accent)}.k.nk.sh small{color:var(--ink);font-weight:700}
.res{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:10px}.res div{border:1px solid var(--line);border-radius:8px;padding:8px 10px}.res b{display:block;font-size:1.3rem}.res span{color:var(--mute);font-size:.85rem}
.hide{display:none}
.msg{color:var(--bad);margin-top:8px}
</style>
</head>
<body>
<main>
<h1>Type your own text</h1>
<p class="sub">Paste text or upload a .txt file, then type it. Works for Hindi and English.</p>

<section id="setup" class="card">
  <label class="l" for="src">Your text</label>
  <textarea id="src" rows="8" placeholder="Paste Hindi or English text here…"></textarea>
  <div class="row">
    <label class="file">Upload .txt<input type="file" id="file" accept=".txt,text/plain"></label>
    <button id="sEn" type="button">English sample</button>
    <button id="sHi" type="button">हिंदी sample</button>
    <label class="chk"><input type="checkbox" id="keepNl"> Keep line breaks (press Enter)</label>
  </div>
  <div class="row">
    <label class="chk">Text size
      <select id="size"><option value="1.1">Medium</option><option value="1.4">Large</option><option value="0.95">Small</option></select>
    </label>
    <label class="chk">Keyboard
      <select id="kb"><option value="auto">Auto (Remington for Hindi text)</option><option value="rem">Hindi Remington always</option><option value="os">My device keyboard</option></select>
    </label>
    <label class="chk">Timer
      <select id="tm"><option value="0">No timer</option><option value="5">5 min</option><option value="10" selected>10 min</option><option value="15">15 min</option><option value="20">20 min</option><option value="30">30 min</option><option value="45">45 min</option><option value="60">1 hour</option><option value="c">Custom…</option></select>
    </label>
    <label class="chk hide" id="tcw"><input type="number" id="tc" min="5" max="60" value="25" style="width:72px;font:inherit;padding:6px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)"> minutes (5 to 60)</label>
    <button id="start" class="primary" type="button">Start typing</button>
  </div>
  <div id="msg" class="msg"></div>
</section>

<section id="play" class="hide">
  <div class="stats">
    <div class="stat"><b id="wpm">0</b><span>WPM</span></div>
    <div class="stat"><b id="acc">100%</b><span>Accuracy</span></div>
    <div class="stat"><b id="err">0</b><span>Mistakes</span></div>
    <div class="stat"><b id="time">0:00</b><span id="tlab">Time</span></div>
  </div>
  <div class="bar"><i id="prog"></i></div>
  <div id="done" class="card done hide"></div>
  <div id="show" class="card" aria-label="Text to type"></div>
  <textarea id="inp" placeholder="Start typing here. The timer begins with your first key." autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
  <div id="kbd" class="hide"></div>
  <div class="row">
    <button id="restart" type="button">Restart</button>
    <button id="back" type="button">Change text</button>
  </div>
  <p class="sub" style="margin-top:14px"><span id="kbnote"></span> Backspace corrects mistakes.</p>
</section>
</main>
<script>
const $=id=>document.getElementById(id);
const SAMPLES={
en:"The quick brown fox jumps over the lazy dog. Regular practice builds speed, and accuracy matters more than speed in the beginning. Keep your eyes on the text and let your fingers find the keys.",
hi:"भारत एक विशाल और विविधताओं से भरा देश है। यहाँ अनेक भाषाएँ बोली जाती हैं और हर क्षेत्र की अपनी संस्कृति है। नियमित अभ्यास से टाइपिंग की गति और शुद्धता दोनों बढ़ती हैं।"
};
let useRem=false,B=[],limit=0,finalEl=0,T=[],start=0,timer=null,prevLen=0,keys=0,errs=0,finished=false,composing=false;

$('tm').onchange=()=>$('tcw').classList.toggle('hide',$('tm').value!=='c');
$('sEn').onclick=()=>$('src').value=SAMPLES.en;
$('sHi').onclick=()=>$('src').value=SAMPLES.hi;
$('file').onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{$('src').value=r.result;$('msg').textContent=''};
  r.onerror=()=>$('msg').textContent='Could not read that file. Try a plain .txt file saved as UTF-8.';
  r.readAsText(f,'UTF-8');
};
$('start').onclick=()=>{
  let t=$('src').value.replace(/\r\n?/g,'\n').replace(/\u200b/g,'');
  t=$('keepNl').checked ? t.split('\n').map(l=>l.replace(/[ \t]+/g,' ').trim()).join('\n').replace(/\n{2,}/g,'\n') : t.replace(/\s+/g,' ');
  t=t.trim();
  if(!t){$('msg').textContent='Add some text first: paste it or upload a .txt file.';return}
  T=Array.from(t);B=T.slice();
  let m=$('tm').value;m=m==='c'?parseInt($('tc').value,10):parseInt(m,10);
  if($('tm').value==='c'&&!(m>=5&&m<=60)){$('msg').textContent='Enter a custom time between 5 and 60 minutes.';return}
  limit=(m||0)*60;$('tlab').textContent=limit?'Time left':'Time';
  useRem=$('kb').value==='rem'||($('kb').value==='auto'&&/[\u0900-\u097F]/.test(t));
  $('kbd').classList.toggle('hide',!useRem);
  $('kbnote').textContent=useRem?'Remington (Gail) layout is on. Type with your normal keyboard; keys are mapped to Hindi automatically. The highlighted key is the next one.':'Using your device keyboard. For Hindi, switch to a Hindi keyboard in your device settings.';
  const fs=$('size').value+'rem';
  $('show').style.fontSize=fs;$('inp').style.fontSize=fs;
  $('setup').classList.add('hide');$('play').classList.remove('hide');
  reset();
};
$('back').onclick=()=>{clearInterval(timer);$('play').classList.add('hide');$('setup').classList.remove('hide')};
$('restart').onclick=reset;
$('show').onclick=()=>$('inp').focus();

function reset(){
  clearInterval(timer);timer=null;start=0;prevLen=0;keys=0;errs=0;finished=false;T=B.slice();finalEl=0;
  const i=$('inp');i.value='';i.disabled=false;
  $('done').classList.add('hide');
  render();stats();i.focus();
}
function render(){
  const typed=Array.from($('inp').value);
  let h='';
  const s0=T.length>2000?Math.max(0,typed.length-150):0,e0=T.length>2000?Math.min(T.length,s0+900):T.length;
  for(let i=s0;i<e0;i++){
    const c=T[i]==='\n'?'↵\n':T[i].replace(/&/g,'&amp;').replace(/</g,'&lt;');
    let cls='pend';
    if(i<typed.length) cls=typed[i]===T[i]?'ok':'bad';
    else if(i===typed.length) cls='cur';
    h+='<span class="'+cls+'">'+c+'</span>';
  }
  $('show').innerHTML=h;drawKb();
  const cur=$('show').querySelector('.cur');
  if(cur){const s=$('show'),top=cur.offsetTop-s.offsetTop;if(top>s.scrollTop+s.clientHeight-50||top<s.scrollTop)s.scrollTop=Math.max(0,top-60)}
}
function correctCount(){
  const typed=Array.from($('inp').value);let n=0;
  for(let i=0;i<typed.length&&i<T.length;i++) if(typed[i]===T[i]) n++;
  return n;
}
function stats(){
  let el=finished?finalEl:(start?(Date.now()-start)/1000:0);
  if(limit&&el>limit)el=limit;
  if(limit&&start&&!finished&&el>=limit){finish();return}
  const mins=el/60;
  const ok=correctCount();
  $('wpm').textContent=mins>0.02?Math.round((ok/5)/mins):0;
  $('acc').textContent=keys?Math.max(0,Math.round(100*(keys-errs)/keys))+'%':'100%';
  $('err').textContent=errs;
  const s=limit?Math.ceil(limit-el):Math.floor(el);$('time').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
  $('prog').style.width=(limit?100*el/limit:100*Array.from($('inp').value).length/T.length)+'%';
}
function onInput(){
  if(composing||finished) return;
  const i=$('inp');
  let typed=Array.from(i.value);
  if(limit)while(T.length<=typed.length+400)T=T.concat(/\s/.test(T[T.length-1])?[]:[' '],B);
  if(typed.length>T.length){typed=typed.slice(0,T.length);i.value=typed.join('')}
  if(!start&&typed.length){start=Date.now();timer=setInterval(stats,250)}
  for(let k=prevLen;k<typed.length;k++){keys++;if(typed[k]!==T[k])errs++}
  prevLen=typed.length;
  render();stats();
  if(typed.length===T.length) finish();
}
function finish(){
  finished=true;clearInterval(timer);finalEl=Math.min(start?(Date.now()-start)/1000:0,limit||1e9);stats();
  $('inp').disabled=true;
  const d=$('done');
  const n=Array.from($('inp').value).length,ok=correctCount(),mn=Math.max(finalEl,1)/60;
  const fm=x=>Math.floor(x/60)+':'+String(Math.floor(x%60)).padStart(2,'0');
  d.innerHTML='<b>'+(limit&&finalEl>=limit?'Time’s up.':'Finished.')+'</b> Your result:<div class="res">'+[['Net speed',Math.round(ok/5/mn)+' WPM'],['Gross speed',Math.round(n/5/mn)+' WPM'],['Accuracy',(keys?Math.max(0,Math.round(1000*(keys-errs)/keys)/10):100)+'%'],['Mistakes made',errs],['Left uncorrected',n-ok],['Characters typed',n],['Time',fm(finalEl)]].map(r=>'<div><b>'+r[1]+'</b><span>'+r[0]+'</span></div>').join('')+'</div>';
  d.scrollIntoView({block:'nearest'});
  d.classList.remove('hide');
}
const REM={KeyQ:['ौ','औ'],KeyW:['ै','ऐ'],KeyE:['ा','आ'],KeyR:['ी','ई'],KeyT:['ू','ऊ'],KeyY:['ब','भ'],KeyU:['ह','ङ'],KeyI:['ग','घ'],KeyO:['द','ध'],KeyP:['ज','झ'],BracketLeft:['ड','ढ'],BracketRight:['़','ॉ'],
KeyA:['ो','ओ'],KeyS:['े','ए'],KeyD:['्','अ'],KeyF:['ि','इ'],KeyG:['ु','उ'],KeyH:['प','फ'],KeyJ:['र','ऱ'],KeyK:['क','ख'],KeyL:['त','थ'],Semicolon:['च','छ'],Quote:['ट','ठ'],
KeyZ:['ॅ','ऑ'],KeyX:['ं','ँ'],KeyC:['म','ण'],KeyV:['न','ऩ'],KeyB:['व','ऴ'],KeyN:['ल','ळ'],KeyM:['स','श'],Comma:[',','ष'],Period:['.','।'],Slash:['य','य़'],Equal:['ृ','ऋ']};
const ROWS=[['KeyQ','KeyW','KeyE','KeyR','KeyT','KeyY','KeyU','KeyI','KeyO','KeyP','BracketLeft','BracketRight'],['KeyA','KeyS','KeyD','KeyF','KeyG','KeyH','KeyJ','KeyK','KeyL','Semicolon','Quote'],['KeyZ','KeyX','KeyC','KeyV','KeyB','KeyN','KeyM','Comma','Period','Slash']];
const REV={};for(const c in REM)REM[c].forEach((ch,s)=>{if(!(ch in REV))REV[ch]={c,s}});
function drawKb(){
  if(!useRem)return;
  const n=T[Array.from($('inp').value).length],t=n&&REV[n];
  $('kbd').innerHTML=ROWS.map(r=>'<div class="krow">'+r.map(c=>'<div class="k'+(t&&t.c===c?' nk'+(t.s?' sh':''):'')+'"><small>'+REM[c][1]+'</small><b>'+REM[c][0]+'</b></div>').join('')+'</div>').join('');
}
$('inp').addEventListener('keydown',e=>{
  if(!useRem||finished||e.ctrlKey||e.metaKey||e.altKey)return;
  const m=REM[e.code];if(!m)return;
  e.preventDefault();
  $('inp').value+=m[e.shiftKey?1:0];onInput();
});
$('inp').addEventListener('input',onInput);
$('inp').addEventListener('compositionstart',()=>composing=true);
$('inp').addEventListener('compositionend',()=>{composing=false;onInput()});
</script>
</body>
</html>

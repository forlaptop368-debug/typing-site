<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Chat - Typing Studio</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,sans-serif;background:var(--bg,#fbf8f1);height:100vh;display:flex;flex-direction:column}
.chat-header{background:linear-gradient(135deg,#a67c1a,#d4af37);color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center}
.chat-header h1{font-size:1.2rem;font-weight:600}
.chat-header .status{font-size:.8rem;opacity:.9}
.chat-messages{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:12px}
.message{max-width:75%;padding:12px 16px;border-radius:18px;font-size:.95rem;line-height:1.5}
.user{align-self:flex-end;background:linear-gradient(135deg,#a67c1a,#d4af37);color:#fff;border-bottom-right-radius:4px}
.assistant{align-self:flex-start;background:var(--surface,#fff);border:1px solid var(--line,#d6ddd7);border-bottom-left-radius:4px}
.chat-input{padding:16px;border-top:1px solid var(--line,#d6ddd7);display:flex;gap:10px}
.chat-input textarea{flex:1;border:1px solid var(--line,#d6ddd7);border-radius:24px;padding:12px 16px;font:inherit;font-size:.95rem;resize:none;outline:none}
.chat-input textarea:focus{border-color:#a67c1a}
.chat-input button{background:linear-gradient(135deg,#a67c1a,#d4af37);color:#fff;border:0;border-radius:24px;padding:12px 24px;font:inherit;font-size:.95rem;cursor:pointer;font-weight:600}
.chat-input button:hover{filter:brightness(1.1)}
.typing{display:inline-block}
.typing span{animation:blink 1s infinite}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,60%,100%{opacity:1}30%{opacity:0}}
</style>
</head>
<body>
<div class="chat-header">
  <h1>🤖 AI Assistant</h1>
  <div class="status" id="status">● Online</div>
</div>
<div class="chat-messages" id="messages">
  <div class="message assistant">Hi! I'm your typing assistant. I can help you with Hindi typing, Remington Gail layout, exam scoring, or any questions about typing practice. How can I help?</div>
</div>
<div class="chat-input">
  <textarea id="input" rows="1" placeholder="Ask me anything about typing..." oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px'"></textarea>
  <button onclick="sendMessage()">Send</button>
</div>
<script>
const messagesEl=document.getElementById('messages');
const inputEl=document.getElementById('input');
let conversation=[];

function addMessage(text, sender){
  const div=document.createElement('div');
  div.className='message '+sender;
  div.innerHTML=text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop=messagesEl.scrollHeight;
}

function showTyping(){
  const div=document.createElement('div');
  div.className='message assistant';
  div.id='typing-indicator';
  div.innerHTML='<span class="typing"><span>.</span><span>.</span><span>.</span></span>';
  messagesEl.appendChild(div);
  messagesEl.scrollTop=messagesEl.scrollHeight;
}

function hideTyping(){
  const el=document.getElementById('typing-indicator');
  if(el)el.remove();
}

async function sendMessage(){
  const text=inputEl.value.trim();
  if(!text)return;

  addMessage(text, 'user');
  inputEl.value='';
  inputEl.style.height='auto';

  conversation.push({role:'user', content:text});
  showTyping();

  try{
    const response=await fetch('/api/chat', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({messages:conversation})
    });
    const data=await response.json();
    hideTyping();
    addMessage(data.reply, 'assistant');
    conversation.push({role:'assistant', content:data.reply});
  }catch(e){
    hideTyping();
    addMessage('Sorry, I cannot connect to the AI right now. Please try again later.', 'assistant');
  }
}

inputEl.addEventListener('keypress', e=>{
  if(e.key==='Enter'&&!e.shiftKey){
    e.preventDefault();
    sendMessage();
  }
});
</script>
</body>
</html>
